services:
  - type: web
    name: campusconnect-ai-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: BEC_DATASET_PATH
        value: data/bec_campusconnect_dataset.json
      - key: LLM_PROVIDER
        value: none
